version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema.sql"
    queries: "internal/auth/repository/sqlc/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/auth/repository/sqlc/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
